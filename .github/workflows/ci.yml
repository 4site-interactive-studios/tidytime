# CI for TidyTime.
#
# Why this exists: until now there was none. With one person committing that was survivable; with a
# team it means nothing enforces the suite — and this repo's two worst production bugs were both
# fixture-versus-reality mismatches that a green suite reported as fine. The guardrail job matters
# most: a QC pass showed that a POST-to-Productive writer and a ScreenCaptureKit screen reader both
# passed the full suite before GuardrailEnforcementTests existed.
#
# macOS runner because this is a macOS app with a SwiftPM package. The package tests need no signing
# and no Xcode project, which is why `make test` is the fast gate; the app target needs a
# DEVELOPMENT_TEAM we cannot put in CI, so it is type-checked rather than built.
#
# This file was written once before and lost: it landed in the main checkout instead of the worktree
# the commit was made from, so `git add -A` never saw it and a commit message claimed CI that did not
# exist. Nothing catches that — a commit message is not executable — which is the same class of
# defect as this repo's orphaned jobs, one level up.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + doc links
    runs-on: macos-15
    # A hang has to fail rather than burn the 6-hour default. A cold build of this package plus its
    # test bundle runs well under this; anything approaching it is a hang, not slowness.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # SwiftPM's checkouts and build products are the slow part; key on the resolved file so a
      # dependency bump busts the cache rather than silently reusing a stale GRDB.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            Packages/TidyKit/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Packages/TidyKit/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # Print it, because this is the whole reason CI earns its keep here: the runner's Xcode is
      # OLDER than any developer machine on this project (16.4 vs 26.x), and the first run caught a
      # main-actor isolation error that the newer compiler waves through. Do not "fix" a failure by
      # pinning this forward without reading it first — the older toolchain is usually correct.
      - name: Show toolchain
        run: swift --version && xcodebuild -version

      # Runs the whole suite including GuardrailEnforcementTests, which is the point: G1 (never
      # write to Productive), G3 (never touch a screen-capture API), G6 (no secrets in sources),
      # and the check that every pipeline job still has a production call site.
      - name: make test
        run: make test

      # Doc links were broken on a fresh clone for the repo's entire history — four setup guides
      # were gitignored by an unanchored `build/`. This is the guard against that recurring.
      - name: make lint
        run: make lint

  typecheck-app:
    name: App target type-check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            Packages/TidyKit/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Packages/TidyKit/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # The app target cannot be BUILT here: signing needs a DEVELOPMENT_TEAM from the gitignored
      # Local.xcconfig, and an ad-hoc signature would defeat G7 (a changing signature makes macOS
      # silently revoke the TCC grants the app depends on). Type-checking still catches the
      # SwiftUI/availability breakage that package tests never see — App/ is not in the package.
      - name: make typecheck-app
        run: make typecheck-app
