      <rect x="83" y="204" width="7"  height="30" rx="3" fill="#5b6472"/>
      <rect x="92" y="204" width="11" height="30" rx="3" fill="#5b6472"/>
      <rect x="105" y="204" width="150" height="30" rx="3" fill="#7fd39b"/>
