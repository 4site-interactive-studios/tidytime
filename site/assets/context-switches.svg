    <rect x="120" y="252" width="10" height="10" rx="2" fill="#6f9ed3"/><text x="136" y="261">meeting</text>
    <rect x="200" y="252" width="10" height="10" rx="2" fill="#6f7a8a"/><text x="216" y="261">sustained</text>
    <rect x="290" y="252" width="10" height="10" rx="2" fill="#5b6472"/><text x="306" y="261">brief (&lt; 2 min)</text>
  </g>

  <text x="28" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#6b7280">Illustrative mockup · synthetic data · not a live screenshot</text>
</svg>
