      <rect x="290" y="204" width="24" height="30" rx="3" fill="#6f7a8a"/>
      <rect x="316" y="204" width="9"  height="30" rx="3" fill="#5b6472"/>
      <rect x="327" y="204" width="70" height="30" rx="3" fill="#6f9ed3"/>
      <rect x="399" y="204" width="11" height="30" rx="3" fill="#5b6472"/>
      <rect x="412" y="204" width="7"  height="30" rx="3" fill="#5b6472"/>
      <rect x="421" y="204" width="15" height="30" rx="3" fill="#5b6472"/>
      <rect x="438" y="204" width="6"  height="30" rx="3" fill="#5b6472"/>
      <rect x="446" y="204" width="30" height="30" rx="3" fill="#6f7a8a"/>
      <rect x="478" y="204" width="9"  height="30" rx="3" fill="#5b6472"/>
      <rect x="489" y="204" width="210" height="30" rx="3" fill="#7fd39b"/>
      <rect x="701" y="204" width="8"  height="30" rx="3" fill="#5b6472"/>
      <rect x="711" y="204" width="12" height="30" rx="3" fill="#5b6472"/>
      <rect x="725" y="204" width="6"  height="30" rx="3" fill="#5b6472"/>
      <rect x="733" y="204" width="40" height="30" rx="3" fill="#6f7a8a"/>
      <rect x="775" y="204" width="10" height="30" rx="3" fill="#5b6472"/>
      <rect x="787" y="204" width="7"  height="30" rx="3" fill="#5b6472"/>
      <rect x="796" y="204" width="14" height="30" rx="3" fill="#5b6472"/>
